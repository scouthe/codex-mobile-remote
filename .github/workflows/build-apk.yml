name: Build Android remote client

on:
  push:
    branches: [main, android-remote-client]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The web/server sources are built as a CI check.  The remote APK only
      # contains the Android shell and never bundles a local Codex runtime.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Vue frontend
        run: pnpm run build:frontend

      - name: Build CLI server
        run: pnpm run build:cli

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/codexapp-remote.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexapp-remote
          path: android/app/build/outputs/apk/debug/codexapp-remote.apk

      - name: Generate changelog
        if: github.ref == 'refs/heads/android-remote-client'
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --reverse)
          else
            CHANGES=$(git log --pretty=format:"- %s" --reverse -20)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.ref == 'refs/heads/android-remote-client'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: remote-v${{ github.run_number }}
          name: "Codex App Remote v${{ github.run_number }}"
          body: |
            🔗 **Codex App Remote** — Android client for a remote codexapp server

            📱 Connects to a Codex app-server running on your computer over HTTPS/Tailscale.

            ### Changes
            ${{ steps.changelog.outputs.notes }}

            ---
            Built from commit ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/codexapp-remote.apk
          draft: false
          prerelease: false
