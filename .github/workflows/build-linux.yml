name: Build Linux installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish (for example v0.1.88). Leave empty for an artifact only.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate

      - name: Build Linux release archive
        run: scripts/build-linux-release.sh release

      - name: Add installer
        run: cp install.sh release/install.sh

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexapp-linux-amd64
          path: |
            release/codexapp-linux-amd64.tar.gz
            release/SHA256SUMS
            release/install.sh

      - name: Publish GitHub release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Codex Remote ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            release/codexapp-linux-amd64.tar.gz
            release/SHA256SUMS
            release/install.sh
